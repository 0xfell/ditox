syntax = "proto3";

package ditox.sync.v1;

message Hello {
  uint32 protocol_version = 1;
  string name = 2;
  uint64 db_schema_version = 3;
}

message DigestRequest {
  uint32 limit = 1;
  optional string since_iso8601 = 2;
}

message DigestResponse {
  repeated EntryDigest entries = 1;
}

message EntryDigest {
  string id = 1;
  string entry_hash = 2;
  string updated_at = 3;
  bool pinned = 4;
}

message EntryRequest {
  repeated string entry_ids = 1;
}

message EntryPayload {
  string id = 1;
  string entry_hash = 2;
  repeated FormatPayload formats = 3;
}

message FormatPayload {
  string format_name = 1;
  string format_hash = 2;
  oneof body {
    bytes inline = 10;
    BlobChunk blob_chunk = 11;
  }
}

message BlobChunk {
  string blob_hash = 1;
  uint64 total_bytes = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool last = 5;
}

message Bye {}
