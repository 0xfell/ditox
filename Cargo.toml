[workspace]
members = ["ditox-core", "ditox-tui", "ditox-gui"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/0xfell/ditox"
authors = ["0xfell"]

[workspace.dependencies]
# Shared dependencies
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
hex = "0.4.3"
sha2 = "0.11.0"
uuid = { version = "1.23.1", features = ["v4"] }
directories = "6.0.0"
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.18"
nucleo-matcher = "0.3.1"
regex = "1.12.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
unicode-normalization = "0.1.24"
rhai = { version = "1.23.6", default-features = false, features = ["std", "sync"] }

# Platform-specific
wl-clipboard-rs = "0.9.3"
libc = "0.2.186"
arboard = "3.6.1"
sysinfo = "0.38.4"
# Linux suspend/resume awareness via logind PrepareForSleep
# (Phase 3 sub-task 3.5). Pure Rust — no system libdbus dep.
# Default features include async-io for the runtime; the
# `blocking-api` wrapper lets us subscribe sync from a worker thread.
zbus = { version = "5", features = ["blocking-api"] }
# Cross-platform file locking (advisory flock on Unix, LockFileEx on Windows)
fs2 = "0.4.3"
# Signal handling (Unix-only; we use cfg gates)
ctrlc = { version = "3.4.5", features = ["termination"] }

# TUI-specific
ratatui = "0.30.0"
crossterm = "0.29.0"
# `chafa-dyn` (default) needs pkg-config + libchafa at build time on every
# host that compiles the TUI. We rely on the bundled protocols
# (kitty/sixel/iterm2/halfblocks) instead — those cover every modern
# terminal and don't require any system library. Halfblocks is the
# universal fallback, so image preview still works everywhere chafa would
# have helped.
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm"] }
clap = { version = "4.6.1", features = ["derive"] }

# GUI-specific
iced = { version = "0.14.0", features = ["image", "tokio"] }
# Phase 4 sub-task 4.3: wlr-layer-shell window for Linux compositors
# that support the protocol (Hyprland / Sway / wlroots / Kde Plasma 5.27+).
# Pinned to 0.17.1 through Phase 4 to avoid the in-flight 0.18 beta
# churn; unpin in v0.5. ADR: docs/notes/adr/0001-layer-shell-strategy.md.
iced_layershell = "=0.17.1"
tray-icon = "0.22.1"
global-hotkey = "0.7.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync"] }

# Testing
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
